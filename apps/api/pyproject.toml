[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sensoria-shop-api"
version = "0.2.0"
description = "FastAPI backend skeleton for sensoria-shop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "qrcode>=8,<9",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "tzdata>=2025.2,<2027",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
    "types-qrcode>=7.4,<9",
    "types-reportlab>=5.0.0.20261008",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensoria = ["py.typed", "assets/fonts/*"]

[tool.mypy]
mypy_path = ["src"]
explicit_package_bases = true
